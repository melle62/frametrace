name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest
      - name: System info on a real Windows machine
        run: python -c "from frametrace import sysinfo, report; i = sysinfo.collect(); print(chr(10).join(report.render_system(i.to_dict()))); print('errors:', i.errors)"
