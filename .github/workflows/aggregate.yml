name: Aggregate dataset

# Weekly: read the shared dataset, score it, and update the game skills' Community data
# tables. Opens a PR when a table changed (never pushes to main). Needs "Allow GitHub Actions
# to create and approve pull requests" in Settings → Actions → General.
on:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the dataset
        id: data
        run: |
          if git clone --depth 1 --branch data https://github.com/melle62/frametrace-data dataset; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "No dataset yet." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Aggregate
        if: steps.data.outputs.ok == 'true'
        run: python tools/aggregate.py --data dataset --report >> "$GITHUB_STEP_SUMMARY"
      - name: Open a PR when a table changed
        if: steps.data.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- skills; then
            echo "No table changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="data/community-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add skills
          git commit -m "Update the community data in the game skills"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Community data $(date -u +%Y-%m-%d)" \
            --body "Generated by tools/aggregate.py from the Frametrace dataset (melle62/frametrace-data). The run's summary lists every contributor's level." \
            || echo "A PR for $branch is already open." >> "$GITHUB_STEP_SUMMARY"
