[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frametrace"
version = "0.0.1"
description = "Lightweight game benchmarking: frame times, CPU vs GPU bottleneck, and a compact report for AI-assisted optimization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Stdlib only. The window bundles IBM Plex (SIL OFL 1.1) in frametrace/assets/fonts.
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Benchmark",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/melle62/frametrace"
Issues = "https://github.com/melle62/frametrace/issues"

[project.scripts]
frametrace = "frametrace.__main__:main"

[tool.setuptools]
packages = ["frametrace"]

[tool.setuptools.package-data]
frametrace = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt", "assets/*.png", "assets/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
