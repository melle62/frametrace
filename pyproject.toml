[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frametrace"
version = "0.0.1"
description = "Lightweight game benchmarking: frame times, CPU vs GPU bottleneck, and a compact report for AI-assisted optimization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The core is stdlib-only. sv-ttk gives the window its Windows 11 look; the GUI also runs without it.
dependencies = ["sv-ttk>=2.6"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Benchmark",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/melle62/frametrace"
Issues = "https://github.com/melle62/frametrace/issues"

[project.scripts]
frametrace = "frametrace.__main__:main"

[tool.setuptools]
packages = ["frametrace"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
